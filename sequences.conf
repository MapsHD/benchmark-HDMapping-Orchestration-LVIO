# Sequences used by the benchmark. Steps 1 and 3-6 read this file through algos_lib.sh.
#
# id      : short name, unique across datasets. Used for the common bag
#           (datasets/<dataset>/common-ros1/<id>.bag) and the results folder (results/<id>/<algorithm-id>).
# dataset : folder under datasets/ holding the original bag, its ground truth and its common bags.
#           Its calibration and ground-truth description: steps/1_prepare_data/<dataset, lowercase>_calibration.yaml.
#             COCO   = Newer College Multi-Cam 2021 (Ouster OS0-128 + Alphasense Core)
#             BUNKER = Bunker DVI dataset, the LIO benchmark's reg-1 (Livox Mid-360 + D455F + ...)
# bag     : original bag, relative to datasets/<dataset>/.
#
# id          | dataset | bag
quad-easy     | COCO    | 2021-07-01-10-37-38-quad-easy-004.bag
quad-medium   | COCO    | 2021-07-01-11-31-35_0-quad-medium-001.bag
quad-hard     | COCO    | 2021-07-01-11-35-14_0-quad-hard-002.bag
stairs        | COCO    | 2021-07-01-10-40-50_0-stairs-003.bag
reg-1         | BUNKER  | reg-1.bag
