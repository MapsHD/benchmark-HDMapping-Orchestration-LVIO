# Single source of truth for every algorithm in the LVIO benchmark.
# Steps 2 and 3 (and every algorithms/<dir>/run.sh) read this file through algos_lib.sh.
#
# distro : ROS distribution inside the image (noetic | melodic). Also the image tag suffix.
# dir    : folder under algorithms/ holding Dockerfile, run.sh, config/ and NOTES.md.
# id     : short name. Used for the results folder (results/<sequence>/<id>) and,
#          lowercased, the Docker image tag: <id>_<distro>.
# input  : which prepared data the algorithm reads:
#            common-ros1 = the per-sequence common ROS 1 bag from Step 1
#                          (datasets/COCO/common-ros1/<sequence>.bag, uncompressed)
#          A ROS 2 algorithm would get a 'common-ros2' kind (not needed yet: all algorithms are ROS 1).
#
# distro | dir        | id         | input
noetic   | COIN-LIO   | coin-lio   | common-ros1
noetic   | FAST-LIVO2 | fast-livo2 | common-ros1
noetic   | r3live     | r3live     | common-ros1
melodic  | LVI-SAM    | lvi-sam    | common-ros1
noetic   | Coco-LIC   | coco-lic   | common-ros1
