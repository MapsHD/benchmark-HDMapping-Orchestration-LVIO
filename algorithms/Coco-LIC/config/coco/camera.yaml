%YAML:1.0
image_topic: /lvio/cam0_rect  # suffix "compressed" omitted: Coco-LIC reads <topic>/compressed too
image_width: 720
image_height: 540
# rectified cam0 (steps/1_prepare_data/coco_calibration.yaml, cam0_rect), no distortion
cam_fx: 272.29
cam_fy: 273.70
cam_cx: 357.52
cam_cy: 255.50
cam_d0: 0.0
cam_d1: 0.0
cam_d2: 0.0
cam_d3: 0.0
cam_d4: 0.0

CameraExtrinsics:  # camera to imu: cam0 pose in the Alphasense IMU frame, Rot row-major
    Trans: [0.049222, 0.047237, -0.009400]
    Rot: [ 0.003439, -0.001005,  0.999994,
           0.999976,  0.006020, -0.003433,
          -0.006016,  0.999981,  0.001026]

img_time_offset: 0.0018  # camera to imu [s] (Kalibr: t_imu = t_cam + 0.0018)
