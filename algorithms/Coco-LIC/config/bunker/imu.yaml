imu_topic: /livox/imu        # Livox Mid-360 built-in IMU, 200 Hz
imu_excite_threshold: 0.5  # statical initialization, do not move!
gravity_mag: 9.81
if_normalized: true          # acceleration is in g (Livox), as in Coco-LIC's FAST-LIVO configs
if_use_init_bg: false

IMUExtrinsics:  # imu to imu
    Trans: [0, 0, 0]
    Rot: [1, 0, 0,
          0, 1, 0,
          0, 0, 1]
