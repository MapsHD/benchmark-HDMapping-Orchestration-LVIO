# Step 4 export of a FAST-LIVO2 run (read by steps/4_export/export_results.py; keys explained there).
frames:
  world: camera_init (first Alphasense IMU pose)
  body: Alphasense IMU (z down)
trajectory:
  # FAST-LIVO2's own TUM file (config/coco.yaml, evo:), stamped with the LIO update time.
  # /aft_mapped_to_init is stamped with ros::Time::now() (LIVMapper.cpp:1340), i.e. publish time.
  source: tum_file
  file: result/trajectory.txt
map:
  # In LIVO mode the LIO step publishes an empty cloud and the VIO step the scan's points that
  # fall inside cam0, coloured from the image (LIVMapper.cpp:1133-1189): FAST-LIVO2's colour map.
  source: accumulate
  topic: /cloud_registered
  attribute: rgb
  description: sum of the coloured /cloud_registered clouds (only points seen by cam0)
