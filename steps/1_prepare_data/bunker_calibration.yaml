# Calibration and ground truth of the BUNKER dataset (Bunker DVI dataset, the LIO benchmark's reg-1),
# used by make_common_bag.py (Step 1), the algorithm configs (algorithms/*/config/bunker/) and Step 5.
#
# The dataset's own calibration files (Kalibr + direct_visual_lidar_calibration) are not reachable:
# its download share is gone (2026-11-21). Sources of the values below:
#   - Livox Mid-360 IMU <-> LiDAR: Livox Mid-360 manual (IMU at 11.0, 23.29, -44.12 mm in the point cloud
#     frame, axes aligned), the value the LIO benchmark's FAST-LIO and LIO-SAM configs use.
#   - D455F colour intrinsics: its /d455f/color/camera_info (factory).
#   - LiDAR <-> D455F colour camera and the D455F time offset: ESTIMATED from the data by
#     notes/scripts/bunker_d455_extrinsic.py (log: notes/scripts/bunker_d455_extrinsic.log):
#     322 D455F depth frames (1 per second) placed with the ground-truth poses and registered to the FARO
#     map (point-to-plane ICP, 24-orientation multi-start, time-offset sweep); median |residual| 1.1 cm,
#     80 % of the points within 5 cm. The colour camera follows from the factory /tf_static
#     (d455f_link -> depth / colour optical frames). The ground truth is the Livox LiDAR pose (checked, base_frame).
# The algorithm configs copy these numbers: change them together.

lidar:
  topic: /livox/lidar                      # livox_ros_driver2/CustomMsg, 10 Hz, frame livox_frame
  model: Livox Mid-360

imu:                                       # the Livox Mid-360 built-in IMU: the one IMU every algorithm uses
  topic: /livox/imu                        # 200 Hz, linear acceleration in g (|a| ~ 1 at rest)
  acceleration_unit: g
  T_lidar_imu:                             # IMU pose in the LiDAR frame
    rotation: identity
    translation: [0.011, 0.02329, -0.04412]

camera:                                    # the one camera every algorithm uses: D455F colour
  topic: /d455f/color/image_raw/compressed # 15 Hz, RGB JPEG
  resolution: [640, 480]
  intrinsics: [386.1224, 385.5966, 325.3496, 238.9214]                 # fx, fy, cx, cy
  distortion_model: plumb_bob
  distortion_coeffs: [-0.0569539, 0.0654811, 0.0007867, 0.0003414, -0.0213012]   # k1 k2 p1 p2 k3
  T_lidar_camera:                          # colour optical frame (z forward, x right, y down) in the LiDAR frame
    rotation: [-0.011442, 0.165756, 0.986100,
               -0.999841, 0.011577, -0.013548,
               -0.013662, -0.986099, 0.165597]
    translation: [0.087088, -0.043665, -0.126414]
  time_offset_s: -0.03                     # camera stamp + offset = LiDAR / ground-truth time (USB camera, software sync)

camera_rect:                               # /lvio/d455_rect/compressed: undistorted pinhole, same size, rotation = I
  topic: /lvio/d455_rect/compressed
  resolution: [640, 480]
  intrinsics: [381.93, 381.16, 325.59, 239.48]   # cv2.getOptimalNewCameraMatrix(alpha=0): no black border
  jpeg_quality: 95

ground_truth:                              # Step 5 / 6
  format: tum                              # HDMapping ground-truth session, ~200 Hz, starts ~20 s after the bag
  file: HDMappingGroundTruth/lio_result_0/lio_result_0_trajectory_tum.txt   # relative to datasets/BUNKER/
  max_rate_hz: 10                          # evaluated at 10 Hz, as COCO
  reference_map: TLS-FARO-Focus/map_gt_0.01.laz   # FARO TLS, same frame (for the map steps, not implemented yet)

base_frame:
  source: data check 2026-11-21 (notes/scripts/base_frame_check_bunker.py) - free lever-arm fit on FAST-LIVO2 gives (4, -1, 3) mm; LiDAR fits better than the Livox IMU for all 4 algorithms
  T_gt_lidar:                              # LiDAR pose in the ground-truth body frame
    rotation: identity
    translation: [0.0, 0.0, 0.0]
